<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<title>SIYOUNG-iphone</title>

<!--
  ================================================================
   가상 스마트폰 구경하기  (단일 파일 / 서버·DB 없음)
  ----------------------------------------------------------------
   ★ 사진·배경화면·이름·대화·게시물 등 모든 데이터는
     아래 <script> 맨 위쪽의 "CONFIG" 영역에 모여 있습니다.
     "★ 교체 가능" 으로 검색하면 수정할 수 있는 부분이 모두 나옵니다.
   ★ 지금 들어간 이미지는 picsum.photos / pravatar.cc 의 임의 이미지입니다.
     내 사진을 쓰려면 경로만 바꾸세요.  예)  './images/photo1.jpg'
   ★ 새로고침하면 항상 잠금화면에서 시작합니다. (저장 기능 없음)
  ================================================================
-->
<link rel="stylesheet" href="./css/style.css">
</head>

<body>
<main class="stage">
  <div class="phone-wrap" id="wrap">
    <div class="phone" id="phone">
      <!-- 옆면 버튼 (오른쪽 전원 버튼을 누르면 화면 잠금) -->
      <i class="btn btn-a"></i><i class="btn btn-v1"></i><i class="btn btn-v2"></i><i class="btn btn-p" id="power" title="화면 잠금"></i>

      <div class="screen" id="screen" data-t="light">
        <!-- 상태바 -->
        <div class="statusbar">
          <div class="sb-l"><span id="sbTime">9:41</span></div>
          <div class="sb-r">
            <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.6a10 10 0 0 1 14 0"/><path d="M4 7.5a6.4 6.4 0 0 1 9 0"/><circle cx="8.5" cy="10.6" r="1.4" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
          </div>
        </div>
        <!-- 다이나믹 아일랜드 (음악 재생 시 확장) -->
        <div class="island" id="island"><span class="i-art" id="iArt"></span><span class="eq"><i></i><i></i><i></i><i></i></span></div>

        <!-- 홈 화면 (잠금화면 아래에 깔려 있음) -->
        <div class="layer home pre" id="home">
          <div class="wp" id="homeWp"></div>
          <div class="home-ui" id="homeUi">
            <div class="home-scroll">
              <div class="widgets">
                <div class="widget w-cal" style="--i:0">
                  <span class="dow" id="wDow">월요일</span><span class="day" id="wDay">2</span>
                  <div class="ev" id="wEv"></div>
                </div>
                <button class="widget w-photo" data-app="gallery" id="wPhoto" style="--i:1"><span>추억<small id="wPhotoCap"></small></span></button>
              </div>
              <div class="grid" id="grid"></div>
            </div>
            <div class="dots"><i></i><i></i><i></i></div>
            <div class="dock" id="dock"></div>
          </div>
        </div>

        <!-- 앱 화면들이 여기에 생성됩니다 -->
        <div id="appLayer"></div>

        <!-- 잠금 화면 -->
        <div class="layer lock" id="lock">
          <div class="wp" id="lockWp"></div>
          <div class="lock-shade"></div>
          <div class="flash-glow"></div>
          <div class="lock-ui" id="lockUi">
            <svg class="padlock" id="padlock" viewBox="0 0 22 26"><path class="shackle" d="M5.5 11V7.5a5.5 5.5 0 0 1 11 0V11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><rect x="2" y="11" width="18" height="13" rx="3.5" fill="#fff"/></svg>
            <div class="l-date" id="lDate"></div>
            <div class="l-time" id="lTime"></div>
            <div class="l-notifs" id="lNotifs"></div>
            <div class="l-bottom">
              <button class="l-btn" id="flashBtn" aria-label="손전등"></button>
              <button class="l-btn" id="camBtn" aria-label="카메라"></button>
            </div>
            <div class="l-hint">위로 쓸어올려 열기</div>
          </div>
        </div>

        <div class="edge-hint" id="edge"></div>
        <div class="toast" id="toast"></div>
        <div class="homebar" id="homebar"><i></i></div>
        <div class="screen-off" id="off"></div>
      </div>
    </div>
  </div>

  <!-- PC용 컨트롤 : 뒤로가기 / 홈 / 잠금 (단축키: Esc = 뒤로, H = 홈, L = 잠금) -->
  <div class="remote">
    <button id="bkBtn" title="뒤로 (Esc)"></button>
    <button id="hmBtn" title="홈 (H)"></button>
    <button id="lkBtn" title="잠금 (L)"></button>
  </div>
</main>

<script src="./js/app.js"></script>
</body>
</html>
